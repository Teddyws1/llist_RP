<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>llist Rp</title>

    <meta 
        name="description" 
        content="Explore a melhor lista RP com servidores atualizados, interface moderna e navegação rápida para encontrar comunidades Roleplay."
    >

    <style>
        body {
            margin: 0;
            background: #0b0f18;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
    
    
    
    <!---código icones--->
<script  type = "module"  src = " https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js " ></script><script nomodule src = " https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js ">   </script>
<!---fim código icone--->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link 
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" 
        rel="stylesheet"
    >

    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link rel="stylesheet" href="roots.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="atualização.css">

    <link 
        rel="icon" 
        href="https://i.postimg.cc/505VX6Rc/Picsart-26-05-22-18-31-49-142.jpg" 
        type="image/png"
    >

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6200ee">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>

<body>

<header>
    <button type="button" class="icon-btn" aria-label="Abrir menu lateral" id="menuBtn" onclick="event.stopPropagation(); toggleSidebar();">
        <i class="fas fa-bars" aria-hidden="true"></i>
    </button>

    <div class="search-wrapper">
        <i class="fas fa-search" aria-hidden="true"></i>
        <label for="searchInput" class="sr-only">Buscar comando</label>
        <input type="text" id="searchInput" placeholder="Buscar comando..." aria-label="Buscar comando">
        <button type="button" class="clear-search" id="clearBtn" aria-label="Limpar busca" onclick="clearSearch()">
            <i class="fas fa-times-circle" aria-hidden="true"></i>
        </button>
    </div>

  <div class="sort-wrapper">

    <i class="fas fa-filter sort-icon"></i>

    <select
        id="sortOption"
        class="sort-select"
        aria-label="Ordenar itens"
        onchange="renderItems()"
    >

        <option value="recent">
            Mais recentes
        </option>

        <option value="alpha-asc">
            A → Z
        </option>

        <option value="alpha-desc">
            Z → A
        </option>

        <option value="id-asc">
            ID menor
        </option>

        <option value="id-desc">
            ID maior
        </option>
    </select>

</div>
</header>

<span id="totalContador" aria-live="polite">0</span>

<aside id="sidebar" class="sidebar" aria-label="Menu lateral">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
<div class="rp-badge">

    <h3 class="rp-title">

        <span>

            llist_RP

            <img
                src="imgs/logo_llist_rp_vector.svg"
                alt="Logo llist_RP"
                class="rp-logo">

        </span>

    </h3>

</div>

        <button type="button" class="icon-btn" aria-label="Fechar aba lateral" onclick="toggleSidebar()">
            &times;
        </button>
    </div>

    <p class="aaviso">
        OBS: FAVORITOS DESAPARECE DEPOIS QUE LIMPA O CACHÊ
    </p>

    <button type="button" onclick="openUpdateModal()" aria-label="Ver atualizações do sistema">
        Ver Atualizações
    </button>

    <br>

    <a href="informação.html" style="text-decoration:none;" aria-label="Abrir página sobre o sistema">
        <button type="button" class="sobre-sistema-btn" aria-label="Abrir página sobre o sistema">
            <span style="display:flex; align-items:center;">
                <i class="fas fa-desktop" aria-hidden="true"></i>
                SOBRE O SISTEMA
            </span>

            <span class="seta" aria-hidden="true"><ion-icon name="chevron-forward-outline"></ion-icon></span>
        </button>
    </a>

    <br>

    <div class="theme-box">
        <div class="theme-left">
            <div class="theme-icon">
                <i class="fas fa-moon" aria-hidden="true"></i>
            </div>

            <span>Modo escuro</span>
        </div>

        <label class="switch" aria-label="Alternar modo escuro">
            <input type="checkbox" checked onclick="toggleTheme()" aria-label="Alternar modo escuro">
            <span class="slider"></span>
        </label>
    </div>

    <hr class="linha-grudada">

    <footer class="rodape">
        &copy; Desenvolvido por Teddy Machado 2026
    </footer>

</aside>

<nav class="nav-tabs" aria-label="Navegação principal">
    <button class="tab-btn active" id="tabAll" type="button" aria-label="Mostrar todos" onclick="switchTab('all')">
        <i class="fas fa-home" aria-hidden="true"></i>
    </button>

    <button class="tab-btn" id="tabFav" type="button" aria-label="Mostrar favoritos" onclick="switchTab('fav')">
        <i class="fas fa-bookmark" aria-hidden="true"></i>
    </button>

    <button class="tab-btn auto-modal-btn" type="button" aria-label="Abrir modal automático" onclick="toggleAutoModal()">
        <i class="fas fa-window-maximize" aria-hidden="true"></i>
    </button>

    <button id="clearAllBtn" class="clear-all-btn" type="button" aria-label="Limpar favoritos" onclick="clearAllFavorites()">
        <i class="fas fa-trash-alt" aria-hidden="true"></i>
    </button>
</nav>

<main class="container">
    <div id="gridItems" class="main-grid" role="list" aria-label="Lista de comandos"></div>
</main>
<div id="itemModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
        <h2 id="modalTitle" style="margin-bottom:5px;">Comando</h2>

        <span id="modalID" style="color:var(--accent); font-weight:900; margin-bottom:15px;">#</span>

        <div class="btn-group">
            <button type="button" class="btn btn-fav" id="favBtn" aria-label="Adicionar aos favoritos">
                Favoritar
            </button>

            <button type="button" class="btn btn-copy" aria-label="Copiar comando" onclick="copyCommand()">
                <i class="fas fa-copy" aria-hidden="true"></i>
                Copiar
            </button>

            <button type="button" class="btn btn-close" aria-label="Fechar modal" onclick="closeModal('itemModal')">
                Fechar
            </button>
        </div>
    </div>
</div>

<div id="textModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="textModalTitle">
    <div class="modal-card">
        <h2 id="textModalTitle" style="color:var(--primary);">
            Título
        </h2>

        <div class="modal-body-scroll">
            <p id="textModalBody" style="color:var(--text-dim); line-height:1.6; font-size:0.95rem; white-space:pre-line;"></p>
        </div>

        <button type="button" class="btn btn-close" aria-label="Fechar mensagem" onclick="closeModal('textModal')" style="width:100%">
            Entendido
        </button>
    </div>
</div>

<script src="atualizacao.js" defer></script>
<script src="bancodedado.js" defer></script>
<script src="script.js" defer></script>
<script src="anticopia.js" defer></script>

</body>
</html>
